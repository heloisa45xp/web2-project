# Mensagens do Spring MVC (resolvidas pelo MessageSource da aplicacao).
#
# Estas mensagens NAO sao restricoes do Bean Validation: elas tratam as falhas
# de conversao de tipo, que acontecem antes da validacao, quando o valor
# recebido do formulario nao pode ser convertido para o tipo do atributo.
# Exemplo: o campo "valor" da consulta e numerico, mas o usuario enviou "abc".
#
# O padrao do codigo e: typeMismatch.<objeto>.<campo>

# Consultas
typeMismatch.consulta.id=Identificador da consulta invalido.
typeMismatch.consulta.data=Informe uma data e hora validas.
typeMismatch.consulta.valor=Informe um valor numerico valido.
typeMismatch.consulta.paciente.id=Selecione um paciente valido.
typeMismatch.consulta.medico.id=Selecione um medico valido.

# Pacientes
typeMismatch.paciente.id=Identificador do paciente invalido.

# Medicos
typeMismatch.medico.id=Identificador do medico invalido.
