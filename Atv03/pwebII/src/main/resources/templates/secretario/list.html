<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Lista de Secretários</title>
</head>

<body>

<main>
    <div class="container my-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h3 mb-0">Lista de Secretários</h2>
            <a class="btn btn-pastel" sec:authorize="hasRole('ADMIN')" th:href="@{/secretario/form}">Novo Secretário</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-pastel align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Usuário</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${secretarios}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.nome}"></td>
                    <td th:text="${s.cpf}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.telefone}"></td>
                    <td th:text="${s.usuario != null ? s.usuario.usuario : '-'}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-pastel" sec:authorize="hasRole('ADMIN')"
                           th:href="@{/secretario/edit/{id}(id=${s.id})}">Editar</a>
                        <a class="btn btn-sm btn-outline-danger" sec:authorize="hasRole('ADMIN')"
                           onclick="return window.confirm('Excluir Secretário(a)?')"
                           th:href="@{/secretario/remove/{id}(id=${s.id})}">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="alert alert-info" th:if="${#lists.isEmpty(secretarios)}">
            Nenhum secretário cadastrado.
        </div>

    </div>
</main>

</body>
</html>
