<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Entrar — Clínica PWEB II</title>
</head>

<body class="login-page">

<main class="container py-4">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-sm-9 col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <div class="login-logo" aria-hidden="true">+</div>
                <h1 class="h3 fw-bold mt-3 mb-1">Clínica PWEB II</h1>
                <p class="text-muted mb-0">Gestão de pacientes, médicos e consultas</p>
            </div>

            <div class="card card-pastel login-card shadow-sm">
                <div class="card-header text-center py-3">
                    <h2 class="h5 mb-0">Acessar o sistema</h2>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Usuário ou senha inválidos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        Você saiu do sistema.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Usuário</label>
                            <input class="form-control" id="username" name="username" type="text"
                                   placeholder="Digite seu usuário" required autofocus autocomplete="username">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Senha</label>
                            <input class="form-control" id="password" name="password" type="password"
                                   placeholder="Digite sua senha" required autocomplete="current-password">
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" id="remember-me" name="remember-me" type="checkbox">
                            <label class="form-check-label" for="remember-me">Lembrar de mim</label>
                        </div>

                        <button class="btn btn-pastel w-100" type="submit">Entrar</button>
                    </form>

                </div>
            </div>

            <p class="text-center small mt-3 mb-0">
                Ainda não é paciente?
                <a class="link-secondary" th:href="@{/paciente/form}">Faça seu cadastro</a>
            </p>

            <p class="text-center text-muted small mt-4 mb-0">
                Programação para Web II — IFTO
            </p>

        </div>
    </div>
</main>

</body>
</html>
