<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Paciente</title>
</head>
<body>
<h2>Cadastro de Paciente</h2>

<form th:action="${paciente.id == null} ? @{/paciente/save} : @{/paciente/update}" th:object="${paciente}" method="post">
    <input type="hidden" th:field="*{id}">

    <label>Nome:</label><br>
    <input type="text" th:field="*{nome}" required><br><br>

    <label>Telefone:</label><br>
    <input type="text" th:field="*{telefone}" required><br><br>

    <button type="submit">Salvar</button>
    <a th:href="@{/paciente/list}">Cancelar</a>
</form>
</body>
</html>
