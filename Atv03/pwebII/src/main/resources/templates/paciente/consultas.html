<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Consultas do Paciente</title>
</head>
<body>
<h2>Consultas de <span th:text="${paciente.nome}"></span></h2>
<a th:href="@{/paciente/list}">Voltar</a><br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Data/Hora</th>
        <th>Valor</th>
        <th>Observação</th>
        <th>Médico</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${consultas}">
        <td th:text="${c.id}"></td>
        <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="'R$ ' + ${c.valor}"></td>
        <td th:text="${c.observacao}"></td>
        <td th:text="${c.medico?.nome}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
