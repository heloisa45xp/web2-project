<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Erro — Clínica PWEB II</title>
</head>

<body>

<main>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="card card-pastel shadow-sm text-center">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Não foi possível concluir a operação</h2>
                    </div>
                    <div class="card-body p-4">

                        <p class="display-4 fw-bold mb-2" th:text="${status} ?: 'Erro'">403</p>
                        <p class="text-muted mb-3" th:text="${error} ?: 'Acesso não autorizado'">Forbidden</p>

                        <p th:if="${status == 403}">
                            Seu perfil não tem permissão para acessar esta página.
                        </p>
                        <p th:if="${status == 404}">
                            A página solicitada não foi encontrada.
                        </p>
                        <p th:if="${status != 403 and status != 404}">
                            Ocorreu um erro inesperado. Tente novamente.
                        </p>

                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <a class="btn btn-pastel" th:href="@{/}">Voltar ao início</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

</body>
</html>
