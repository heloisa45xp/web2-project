
<header th:fragment="header" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar navbar-expand-lg navbar-light navbar-pastel">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Clínica PWEB II</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal"
                    aria-controls="navbarPrincipal" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/paciente/list}">Pacientes</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/medico/list}">Médicos</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/consulta/list}">Consultas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/paciente/form}">Novo paciente</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/consulta/form}">Nova consulta</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-sm btn-pastel" th:href="@{/login}">Entrar</a>
                    </li>
                    <li class="nav-item d-flex align-items-center me-lg-3" sec:authorize="isAuthenticated()">
                        <span class="navbar-text">
                            Olá, <strong sec:authentication="name">usuário</strong>
                        </span>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-outline-secondary" type="submit">Sair</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script>
        // Destaca no menu o item correspondente à página atual
        document.querySelectorAll('#navbarPrincipal .nav-link').forEach(function (link) {
            var destino = new URL(link.getAttribute('href'), window.location.origin).pathname;
            if (window.location.pathname.startsWith(destino)) {
                link.classList.add('active');
                link.setAttribute('aria-current', 'page');
            }
        });
    </script>

</header>
