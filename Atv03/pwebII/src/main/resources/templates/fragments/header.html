
<header th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-light navbar-pastel">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/paciente/list}">Clínica PWEB II</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal"
                    aria-controls="navbarPrincipal" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/paciente/list}"
                           th:classappend="${#request.requestURI.contains('/paciente')} ? 'active'"
                           th:attr="aria-current=${#request.requestURI.contains('/paciente')} ? 'page' : null">Pacientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/medico/list}"
                           th:classappend="${#request.requestURI.contains('/medico')} ? 'active'"
                           th:attr="aria-current=${#request.requestURI.contains('/medico')} ? 'page' : null">Médicos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/consulta/list}"
                           th:classappend="${#request.requestURI.contains('/consulta')} ? 'active'"
                           th:attr="aria-current=${#request.requestURI.contains('/consulta')} ? 'page' : null">Consultas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</header>
