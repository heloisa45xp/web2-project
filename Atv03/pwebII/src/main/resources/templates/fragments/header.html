
<header th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-light navbar-pastel">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/paciente/list}">Clínica PWEB II</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal"
                    aria-controls="navbarPrincipal" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/paciente/list}">Pacientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/medico/list}">Médicos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/consulta/list}">Consultas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script>
        // Destaca no menu o item correspondente à página atual
        document.querySelectorAll('#navbarPrincipal .nav-link').forEach(function (link) {
            var destino = new URL(link.getAttribute('href'), window.location.origin).pathname;
            if (window.location.pathname.startsWith(destino)) {
                link.classList.add('active');
                link.setAttribute('aria-current', 'page');
            }
        });
    </script>

</header>
