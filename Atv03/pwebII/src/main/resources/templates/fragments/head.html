
<head th:fragment="head(links)">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no"/>

    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- Identidade visual pastel do projeto -->
    <style>
        :root {
            --pastel-rosa-claro: #ffd9e3;
            --pastel-rosa: #f9c2d3;
            --pastel-rosa-forte: #ef9db8;
            --pastel-texto: #7a3b52;
            --pastel-destaque: #b03a62;
        }

        body {
            background-color: #fff7fa;
        }

        .navbar-pastel {
            background-color: var(--pastel-rosa-claro) !important;
        }

        .navbar-pastel .navbar-brand,
        .navbar-pastel .nav-link {
            color: var(--pastel-texto);
        }

        .navbar-pastel .nav-link.active,
        .navbar-pastel .nav-link:hover {
            color: var(--pastel-destaque);
            font-weight: 600;
        }

        .navbar-pastel .navbar-brand:hover {
            color: var(--pastel-destaque);
        }

        .btn-pastel {
            background-color: var(--pastel-rosa);
            border-color: var(--pastel-rosa);
            color: var(--pastel-texto);
        }

        .btn-pastel:hover,
        .btn-pastel:focus {
            background-color: var(--pastel-rosa-forte);
            border-color: var(--pastel-rosa-forte);
            color: #fff;
        }

        .table-pastel > :not(caption) > * > * {
            background-color: #fff0f5;
        }

        .card-pastel {
            border-color: var(--pastel-rosa);
        }

        .card-pastel .card-header {
            background-color: var(--pastel-rosa-claro);
            color: var(--pastel-texto);
        }

        /* Página de login */
        .login-page {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 15%, #ffe3ec 0, transparent 45%),
                radial-gradient(circle at 85% 0%, #ffeef5 0, transparent 40%),
                #fff7fa;
        }

        .login-card {
            border-radius: 1rem;
            overflow: hidden;
        }

        .login-card .card-header {
            background: linear-gradient(135deg, var(--pastel-rosa-claro), var(--pastel-rosa));
            border-bottom: 1px solid var(--pastel-rosa);
        }

        .login-logo {
            align-items: center;
            background: linear-gradient(135deg, var(--pastel-rosa), var(--pastel-rosa-forte));
            border-radius: 50%;
            box-shadow: 0 0.5rem 1rem rgba(239, 157, 184, 0.35);
            color: #fff;
            display: inline-flex;
            font-size: 2rem;
            font-weight: 700;
            height: 4rem;
            justify-content: center;
            line-height: 1;
            width: 4rem;
        }

        .login-page .form-control:focus {
            border-color: var(--pastel-rosa-forte);
            box-shadow: 0 0 0 0.25rem rgba(239, 157, 184, 0.25);
        }

        .login-page .form-check-input:checked {
            background-color: var(--pastel-rosa-forte);
            border-color: var(--pastel-rosa-forte);
        }
    </style>

    <th:block th:replace="${links}"/>

</head>
