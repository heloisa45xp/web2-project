<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Cadastro de Médico</title>
</head>

<body>

<main>
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-7">

                <div class="card card-pastel shadow-sm">
                    <div class="card-header">
                        <h2 class="h5 mb-0">
                            <span th:text="${medico.id == null} ? 'Cadastro de Médico' : 'Editar Médico'">Cadastro de Médico</span>
                        </h2>
                    </div>
                    <div class="card-body">

                        <form class="row g-3"
                              th:action="${medico.id == null} ? @{/medico/save} : @{/medico/update}"
                              th:object="${medico}" method="post">

                            <input type="hidden" th:field="*{id}">

                            <div class="col-md-6">
                                <label class="form-label" for="nome">Nome</label>
                                <input class="form-control" id="nome" type="text" th:field="*{nome}"
                                       placeholder="Nome completo" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="cpf">CPF</label>
                                <input class="form-control" id="cpf" type="text" th:field="*{cpf}"
                                       placeholder="000.000.000-00" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-control" id="email" type="email" th:field="*{email}"
                                       placeholder="email@exemplo.com" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="telefone">Telefone</label>
                                <input class="form-control" id="telefone" type="text" th:field="*{telefone}"
                                       placeholder="(00) 00000-0000" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="crm">CRM</label>
                                <input class="form-control" id="crm" type="text" th:field="*{crm}"
                                       placeholder="CRM/UF" required>
                            </div>

                            <div class="col-12 d-flex gap-2">
                                <button class="btn btn-pastel" type="submit">Salvar</button>
                                <a class="btn btn-outline-secondary" th:href="@{/medico/list}">Cancelar</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

</body>
</html>
