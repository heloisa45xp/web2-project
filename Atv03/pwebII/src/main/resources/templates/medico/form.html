<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Médico</title>
</head>
<body>
<h2>Cadastro de Médico</h2>

<form th:action="${medico.id == null} ? @{/medico/save} : @{/medico/update}" th:object="${medico}" method="post">
    <input type="hidden" th:field="*{id}">

    <label>Nome:</label><br>
    <input type="text" th:field="*{nome}" required><br><br>

    <label>CPF:</label><br>
    <input type="text" th:field="*{cpf}" required><br><br>

    <label>Email:</label><br>
    <input type="email" th:field="*{email}" required><br><br>

    <label>Telefone:</label><br>
    <input type="text" th:field="*{telefone}" required><br><br>

    <label>CRM:</label><br>
    <input type="text" th:field="*{crm}" required><br><br>

    <button type="submit">Salvar</button>
    <a th:href="@{/medico/list}">Cancelar</a>
</form>
</body>
</html>
